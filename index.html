<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fate-st-maker</title>
    <style>
      :root { color-scheme: light dark; --bg: #f4f6f9; --fg: #1b2230; --muted: #5d6675; --card: #ffffff; --line: #d9dee6; --accent: #2b78c2; }
      @media (prefers-color-scheme: dark) { :root { --bg: #11151c; --fg: #e6eaf0; --muted: #98a1ae; --card: #19202a; --line: #2b3441; --accent: #6cb4f5; } }
      body { margin: 0; padding: 48px 16px; background: var(--bg); color: var(--fg); font: 15px/1.6 system-ui, -apple-system, "Noto Sans KR", sans-serif; }
      main { max-width: 720px; margin: 0 auto; }
      h1 { margin: 0 0 4px; font-size: 22px; }
      p { margin: 0 0 24px; color: var(--muted); }
      ul { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
      a { display: block; padding: 16px 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: inherit; text-decoration: none; }
      a:hover { border-color: var(--accent); }
      a strong { display: block; color: var(--accent); }
      a span { font-size: 13px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <h1>fate-st-maker</h1>
      <p>만들 것을 고르세요.</p>
      <ul>
        <li>
          <a href="./lostbelt/">
            <strong>이문대 카드</strong>
            <span>정지 이미지 · 인트로 · 아웃트로 애니메이션</span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
